<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            🌿 Habit Flow
        </a>

        <div>
            <button class="btn btn-danger" onclick="logout()">
                Logout
            </button>
        </div>

    </div>
</nav>

<div class="container mt-4">

    <h2 id="welcome"></h2>

    <p id="date" class="text-muted"></p>

    <!-- Dashboard Cards -->

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card dashboard-card shadow">
                <div class="card-body text-center">
                    <h5>Total Habits</h5>
                    <h1 id="totalHabits">0</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card shadow">
                <div class="card-body text-center">
                    <h5>Completed</h5>
                    <h1 id="completedHabits">0</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card dashboard-card shadow">
                <div class="card-body text-center">
                    <h5>Pending</h5>
                    <h1 id="pendingHabits">0</h1>
                </div>
            </div>
        </div>

    </div>

    <!-- Add Habit -->

    <div class="card shadow mt-4 p-4">

        <h4>Add New Habit</h4>

        <div class="input-group mt-3">

            <input type="text"
                   id="habitInput"
                   class="form-control"
                   placeholder="Enter your habit">

            <button class="btn btn-success" onclick="addHabit()">
                Add
            </button>

        </div>

    </div>

    <!-- Habit List -->

    <div class="card shadow mt-4 p-4">

        <h4>Your Habits</h4>

        <ul id="habitList" class="list-group mt-3">

        </ul>

    </div>

    <!-- Progress -->

    <div class="card shadow mt-4 p-4">

        <h5>Today's Progress</h5>

        <div class="progress mt-3">

            <div id="progressBar"
                 class="progress-bar bg-success"
                 style="width:0%">
                0%
            </div>

        </div>

    </div>

</div>

<script src="dashboard.js"></script>  
</body>
</html>
